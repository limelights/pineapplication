spring:
  application:
    name: pine
  datasource:
    url: ${PINE_DATABASE_URL:jdbc:sqlite:./pine.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
